<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Ahorcado</title>
</head>

<body>
  <p>Palabra: <span data-testid="word">{{ word }}</span></p>
  <p>Vidas: <span data-testid="lives">6</span></p>
  <input type="text" data-testid="letra-input" />
  <p data-testid="error-message"></p>

  <script>
    const input = document.querySelector('[data-testid="letra-input"]');
    const error = document.querySelector('[data-testid="error-message"]');

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        if (input.value.length > 1) {
          error.textContent = "Solo se permite una letra por vez";
        } else {
          error.textContent = "";
        }
      }
    });
  </script>
</body>

</html>
