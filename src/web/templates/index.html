<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Ahorcado</title>
</head>

<body>
  <p>Palabra: <span data-testid="word">{{ word }}</span></p>
  <p>Intentos restantes: <span data-testid="intentos">{{ intentos }}</span></p>
  <p>Letras usadas: <span data-testid="letras-usadas">{{ letras_usadas }}</span></p>
  <p>Acertadas: <span data-testid="letras-acertadas"></span></p>
  <p>Falladas: <span data-testid="letras-falladas"></span></p>
  <form method="get" action="/">
    <input type="hidden" name="word" value="{{ palabra }}" />
    <input type="text" name="letra" data-testid="letra-input" />
  </form>
  <p data-testid="error-message">{{ error }}</p>
  <p data-testid="resultado">{{ resultado }}</p>
  <p data-testid="palabra-revelada">{{ palabra_revelada }}</p>
  {% if resultado %}
  <form method="get" action="/nueva">
    <button type="submit" data-testid="jugar-de-nuevo">Jugar de nuevo</button>
  </form>
  {% endif %}
</body>

</html>
