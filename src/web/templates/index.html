<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Ahorcado</title>
</head>

<body>
  <p>Palabra: <span data-testid="word">{{ word }}</span></p>
  <form method="get" action="/">
    <input type="hidden" name="word" value="{{ palabra }}" />
    <input type="text" name="letra" data-testid="letra-input" />
  </form>
  <p data-testid="error-message">{{ error }}</p>
</body>

</html>
