services:
  - type: web
    name: ahorcado
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT "src.web.app:create_app()"
    # El deploy lo dispara el CI (job deploy) cuando pasan todos los tests
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SECRET_KEY
        generateValue: true
